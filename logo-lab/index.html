<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logo lab</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="preload" href="../app/fonts/Kertas.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <header class="top">
    <p class="kicker">Logo lab</p>
    <p class="note">The name in the corner, with one slice of it pulled out long along a bent path, like the board's window walls. Tap a mark to try it in the corner and tune it. Nothing here is on the site yet.</p>
  </header>

  <section class="corner" aria-label="In the corner">
    <canvas id="corner-mark" aria-label="Ikram Hakim"></canvas>
    <span class="corner-mail">ikramandhakim@gmail.com</span>
    <p class="corner-label">in the corner, real size</p>
  </section>

  <section class="hero" aria-label="Close up">
    <canvas id="hero-mark" aria-label="Ikram Hakim, close up"></canvas>
  </section>

  <section class="grid" id="grid" aria-label="Variations"></section>

  <aside class="panel" id="panel" aria-label="Tune the mark">
    <div class="panel-head">
      <strong id="panel-name">Tail</strong>
      <span class="panel-actions">
        <button type="button" id="copy-json">Copy settings</button>
        <button type="button" id="copy">Copy link</button>
      </span>
    </div>
    <div id="controls"></div>
  </aside>

  <script type="module" src="lab.js"></script>
</body>
</html>
